name: Deploy to GCP

on:
  push:
    branches: [main, polish]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: natural-remedies-ai
  GCP_REGION: us-east1
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Build React app
        run: npm install && npm run build

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          REGISTRY="us-east1-docker.pkg.dev"
          IMAGE_NAME="${REGISTRY}/${GCP_PROJECT_ID}/docker-repo/natural-remedies-ai-api:${{ github.sha }}"
          LATEST_IMAGE="${REGISTRY}/${GCP_PROJECT_ID}/docker-repo/natural-remedies-ai-api:latest"
          docker build -t ${IMAGE_NAME} -t ${LATEST_IMAGE} .
          docker push ${IMAGE_NAME}
          docker push ${LATEST_IMAGE}
          echo "IMAGE_NAME=${LATEST_IMAGE}" >> $GITHUB_ENV

      - name: Update Cloud Run service
        run: |
          gcloud run deploy natural-remedies-ai-api-${ENVIRONMENT} \
            --project=${GCP_PROJECT_ID} \
            --region=${GCP_REGION} \
            --image=${IMAGE_NAME} \
            --update-env-vars=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --allow-unauthenticated

      - name: Upload frontend to Cloud Storage
        continue-on-error: true
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${GCP_PROJECT_ID} --format="value(projectNumber)")
          BUCKET_NAME="natural-remedies-ai-frontend-${ENVIRONMENT}-${PROJECT_NUMBER}"
          echo "Uploading to: gs://${BUCKET_NAME}/"
          gsutil -m rsync -r -d dist/ gs://${BUCKET_NAME}/ || echo "Frontend upload failed, but API deployment succeeded"

      - name: Deployment Summary
        run: |
          echo "✓ Deployment Complete!"
          echo "Environment: ${ENVIRONMENT}"
          echo "Cloud Run Service: natural-remedies-ai-api-${ENVIRONMENT}"
          echo "Region: ${GCP_REGION}"
          echo "Project: ${GCP_PROJECT_ID}"

      - name: Create deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✓ Deployment successful!"
          else
            echo "✗ Deployment failed!"
          fi
