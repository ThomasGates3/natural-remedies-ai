<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natural Remedies AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                light: '#22c55e', // green-500
                DEFAULT: '#16a34a', // green-600
                dark: '#15803d'  // green-700
              },
              secondary: '#f97316', // orange-500
              background: {
                light: '#FFFBEF', // Cream
                dark: '#1a2e27'   // Forest Green
              },
              card: {
                light: '#5C4033', // Deep Brown
                dark: '#203a31' // Darker Forest Green for cards
              },
              text: {
                light: '#3D2B1F', // Dark Brown for body text on cream bg
                dark: '#FFFFFF',   // White
                onCard: {
                    light: '#F5F5DC' // Beige
                }
              },
              subtle: {
                light: '#6B4F4B', // Muted brown for subtle body text
                dark: '#a7f3d0',   // Mint Green
                onCard: {
                    light: '#D2B48C' // Tan
                }
              }
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark">

    <script type="module" src="/index.tsx"></script>
</body>
</html>
